<h1>Mis turnos</h1>

<mat-table [dataSource]="turnos" matSort>

  <!-- Fecha/Hora -->
  <ng-container matColumnDef="fechaHora">
    <mat-header-cell *matHeaderCellDef>Fecha/Hora</mat-header-cell>
    <mat-cell *matCellDef="let t">
      {{ t.fechaHora | date:'dd/MM/yyyy HH:mm' }}
    </mat-cell>
  </ng-container>

  <!-- Médico -->
  <ng-container matColumnDef="medico">
    <mat-header-cell *matHeaderCellDef>Médico</mat-header-cell>
    <mat-cell *matCellDef="let t">
      Dr.{{ t.medico.usuario.nombres }}
      {{ t.medico.usuario.apellidos }}
    </mat-cell>
  </ng-container>

  <!-- Valor -->
  <ng-container matColumnDef="valorConsulta">
    <mat-header-cell *matHeaderCellDef>Valor</mat-header-cell>
    <mat-cell *matCellDef="let t">
      {{ t.valorConsulta | moneda }}
    </mat-cell>
  </ng-container>

  <!-- Estado -->
  <ng-container matColumnDef="estado">
    <mat-header-cell *matHeaderCellDef>Estado</mat-header-cell>
    <mat-cell *matCellDef="let t">
      <app-estado-chip [estado]="t.estado"></app-estado-chip>
    </mat-cell>
  </ng-container>

  <!-- Acción -->
  <ng-container matColumnDef="accion">
    <mat-header-cell *matHeaderCellDef>Acción</mat-header-cell>
    <mat-cell *matCellDef="let t">
      <button
       
        mat-stroked-button
        color="warn"
        [disabled]="!puedeCancelarPaciente(t)"
        matTooltip="Solo hasta el día anterior"
        (click)="confirmarCancelar(t)">
        Cancelar
      </button>
    </mat-cell>
  </ng-container>
<mat-header-row
  *matHeaderRowDef="['fechaHora', 'medico', 'valorConsulta', 'estado', 'accion']">
</mat-header-row>

<mat-row
  *matRowDef="let row; columns: ['fechaHora', 'medico', 'valorConsulta', 'estado', 'accion']">
</mat-row>

 
</mat-table>

<mat-paginator [pageSize]="10"></mat-paginator>
